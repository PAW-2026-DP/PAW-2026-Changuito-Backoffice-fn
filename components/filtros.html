<!-- Componente: barra de filtros (cmp-filtros-bar desktop / filtros mobile: buscador + botón).
     Los select varían según la pantalla. -->
<form action="" method="get" role="search">
  <label for="filtro-buscar">Buscar</label>
  <input type="search" id="filtro-buscar" name="q" placeholder="Buscar…">
  <label for="filtro-estado">Estado</label>
  <select id="filtro-estado" name="estado">
    <option value="">Todos</option>
    <option value="activo">Activo</option>
    <option value="suspendido">Suspendido</option>
  </select>
  <button type="submit">Filtrar</button>
</form>
