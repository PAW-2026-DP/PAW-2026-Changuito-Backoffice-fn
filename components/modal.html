<!-- Componente: modal (cmp-modal). Se documenta en estado abierto con el atributo "open". -->
<dialog open aria-labelledby="modal-titulo">
  <form method="dialog">
    <h2 id="modal-titulo">Título del modal</h2>
    <button type="submit" value="cerrar" aria-label="Cerrar">✕</button>
    <p>Contenido del modal.</p>
    <button type="submit" value="cancelar">Cancelar</button>
    <button type="submit" value="confirmar">Confirmar</button>
  </form>
</dialog>
