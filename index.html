<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changuito Backoffice · Ingresar</title>
</head>
<body>
  <header>
    <p>Changuito Backoffice</p>
  </header>

  <main>
    <section aria-labelledby="login-titulo">
      <h1 id="login-titulo">Ingresar al panel</h1>
      <form action="pages/dashboard.html" method="get">
        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="admin@changuito.com" autocomplete="email" required>
        </p>
        <p>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </p>
        <p>
          <label for="rol">Rol</label>
          <select id="rol" name="rol">
            <option value="administrador" selected>Administrador</option>
            <option value="supermercado">Supermercado</option>
          </select>
        </p>
        <button type="submit">Ingresar</button>
      </form>
    </section>
  </main>
</body>
</html>
